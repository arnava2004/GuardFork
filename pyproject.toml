[project]
name = "guardfork"
version = "0.0.1"
description = "Deterministic harness guards as fork-point localizers for same-state preference pairs on AppWorld."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardfork"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "handwritten: originally reserved for hand-written modules; now run by default",
    "pending: originally reserved for W1-W4 stubs; now run by default",
    "docker: requires AppWorld Harbor images; skipped unless images exist",
]
