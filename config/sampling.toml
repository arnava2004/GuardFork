# Student sampling, applied by guardfork.serve.proxy to every chat request that omits these
# fields (Harness-Zero's client sends none). The same file is used on the Mac (mlx_lm.server)
# and on GPU VMs (vLLM), so neither server's own defaults ever decide sampling.
# Source: Qwen3.5 model card, thinking mode, precise coding tasks.

name = "qwen-thinking-code-v1"

# A fresh random seed is drawn per request and logged in the proxy record, so any single
# completion can be re-sampled exactly (batching may still add nondeterminism).
seed_per_request = true

[request]
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0
