# Pinned LLM-judge prompt versions: sha256 of config/judge_prompt.md
# (guardfork.judge.prompt_sha256). tests/test_judge_freeze.py fails when the template no
# longer matches the entry for guardfork.judge.JUDGE_VERSION.
#
# Workflow: while status = "draft", debug the template on dev-set failures only
# (scripts/llm_judge.py --dev-only) and update sha256 here after each edit. Then set
# status = "frozen" and the date; scripts/llm_judge.py refuses non-dev trials until the
# current template matches a frozen entry. After freezing, any edit is a new version (bump
# JUDGE_VERSION, add a new table) and its results are reported separately.

[versions.v1]
sha256 = "40020a0eebe2a8df7efae14315d7f99a957c217e67d536f5a669058b69b3a3d1"
status = "draft"
frozen = ""
judges = "config/judges.toml"   # judge_open (primary), judge_local, judge_claude (eval-only)
output = "distribution"         # {"turns": [{"turn", "p", "reason"}, ...]}, up to 3 entries
tuned_on = "config/dev_set.toml"
